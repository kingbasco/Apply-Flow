name: ApplyFlow QA Supervisor

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Check
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: applyflow-qa-supervisor
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment: Configure Agent 1
    runs-on: ubuntu-latest
    steps:
      - name: Check required QA configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN is missing"; missing=1; else echo "VERCEL_TOKEN: SET"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "::error::VERCEL_PROJECT_ID is missing"; missing=1; else echo "VERCEL_PROJECT_ID: SET"; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY: OPTIONAL / NOT SET"; else echo "GEMINI_API_KEY: SET"; fi
          if [ -z "$VERCEL_TEAM_ID" ]; then echo "VERCEL_TEAM_ID: OPTIONAL / NOT SET"; else echo "VERCEL_TEAM_ID: SET"; fi
          exit "$missing"

  supervise:
    needs: preflight
    environment: Configure Agent 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install browser agent
        run: npm install --global agent-browser

      - name: Run supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPERVISOR_MAX_ATTEMPTS: 5
          SUPERVISOR_MODEL: gemini-3.8-flash
        run: npm run agent
