name: Feature Build Check
# Re-run after syntax fix
on:
  push:
    branches: [feature/loan-interest-participants]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
